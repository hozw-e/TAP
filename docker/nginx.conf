worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Railway terminates TLS at its edge and forwards over plain HTTP, setting
    # X-Forwarded-Proto. PHP reads this (see session.php) to mark cookies Secure.
    sendfile on;
    keepalive_timeout 65;

    # Allow the service worker + manifest to be served with correct types.
    types {
        application/manifest+json  webmanifest;
    }

    server {
        listen 80;

        # The React build is served from the web root.
        root /var/www/html/public;
        index index.html;

        # ----------------------------------------------------------------
        # API: /api/* is served by the PHP backend.
        # A request to /api/auth/login.php executes /var/www/html/api/auth/login.php
        # (same origin as the SPA, so the session cookie is first-party).
        # ----------------------------------------------------------------
        location /api/ {
            root /var/www/html;  # so /api/... maps to /var/www/html/api/...

            # Route PHP files to PHP-FPM; allow query strings and sub-paths.
            location ~ ^/api/.*\.php$ {
                try_files $uri =404;
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                include fastcgi_params;
                # Preserve the forwarded protocol so PHP sees HTTPS behind Railway.
                fastcgi_param HTTPS $http_x_forwarded_proto;
            }

            # Non-.php assets under /api (rare) are served directly if present.
            try_files $uri $uri/ =404;
        }

        # ----------------------------------------------------------------
        # SPA: everything else serves the React app, with history-API fallback
        # so client-side routes (/login, /dashboard, ...) resolve to index.html.
        # ----------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # The service worker must never be cached by the browser/CDN, otherwise
        # clients get stuck on an old shell after a deploy.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
            try_files $uri =404;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
